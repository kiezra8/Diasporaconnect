<!--
  Supabase → Authentication → Emails → Templates → "Reset Password"
  Subject:  Your Diaspora Connect reset code: {{ .Token }}
  Message:  paste everything below this comment.
-->
<div style="margin:0;padding:32px 16px;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px 28px;text-align:center;border:1px solid #e2e8f0;">
    <p style="margin:0 0 4px;font-size:13px;font-weight:bold;letter-spacing:1px;color:#059669;text-transform:uppercase;">Diaspora Connect SACCO</p>
    <h1 style="margin:0 0 20px;font-size:20px;">Reset your password</h1>
    <p style="margin:0 0 12px;font-size:14px;color:#475569;">Your code</p>
    <p style="margin:0 0 24px;font-size:34px;font-weight:bold;letter-spacing:8px;font-family:'Courier New',monospace;color:#059669;">{{ .Token }}</p>
    <p style="margin:0 0 24px;font-size:13px;color:#64748b;">Enter it on the reset page. It expires in 1 hour.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:10px 20px;border-radius:10px;background:#059669;color:#ffffff;text-decoration:none;font-size:13px;font-weight:bold;">Or reset with one tap</a>
    <p style="margin:28px 0 0;font-size:11px;color:#94a3b8;">Didn't ask for this? Ignore this email. Your password stays the same.</p>
  </div>
</div>
