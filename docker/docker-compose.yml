# Diaspora Connect — production stack for the VPS (Contabo, Ubuntu + Docker)
#
#   Database:  Supabase (Auth + Postgres + Realtime) — no database container runs on the VPS
#   API:       NestJS (this repo's /backend) — mobile money, SMS, AI advisor
#   Web:       Caddy serves the built portal (../dist) and proxies api.<domain> → API, with automatic HTTPS
#
# Usage (on the VPS — or just run deploy/deploy.sh):
#   cp backend/.env.example backend/.env   # fill in the Supabase service-role key, MTN, Airtel, Africa's Talking, Anthropic keys
#   npm ci && npm run build                # builds ../dist with the settings in .env.production
#   docker compose -f docker/docker-compose.yml up -d --build
# See docs/DEPLOYMENT.md for the full walkthrough.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../dist:/var/www/html:ro
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  caddy_data:
  caddy_config:
