  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    .signin-hero {
      background: #f8fafc;
      min-height: calc(100vh - 74px);
      margin-top: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Beautiful "DIASPORA CONNECT" background watermark */
    .signin-bg-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      white-space: nowrap;
      width: 100%;
    }
    .signin-bg-watermark span {
      font-family: 'Cinzel', serif;
      font-size: clamp(48px, 11vw, 136px);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.8vw, 20px);
      line-height: 0.95;
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(184, 134, 11, 0.08) 0%, rgba(148, 163, 184, 0.06) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: rgba(184, 134, 11, 0.07);
    }

    /* Small, clean container with pure white background */
    .signin-container {
      position: relative;
      background: #ffffff !important;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 34px 28px 28px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      z-index: 1;
    }

    .signin-content {
      position: relative;
      z-index: 1;
    }

    .signin-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .signin-logo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 2px;
      background: #ffffff;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      color: var(--text-heading);
      background: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.12);
    }

    .forgot-row {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 16px;
    }
    .forgot-link {
      font-size: 12px;
      color: var(--gold-dark);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .signin-btn {
      width: 100%;
      background: linear-gradient(135deg, #b8860b 0%, #946800 100%);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(184, 134, 11, 0.25);
      transition: all 0.25s ease;
    }
    .signin-btn:hover {
      box-shadow: 0 5px 16px rgba(184, 134, 11, 0.4);
      transform: translateY(-1px);
    }

    .signup-option-row {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .signup-toggle-btn {
      color: var(--gold-dark);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin-left: 4px;
    }
    .signup-toggle-btn:hover {
      text-decoration: underline;
    }

    .signup-extra-field {
      display: none;
    }

    @media (max-width: 480px) {
      .signin-container {
        padding: 28px 20px 22px;
        max-width: 320px;
      }
      .signin-hero {
        margin-top: 68px;
      }
    }
  </style>
</head>
<body style="background-color: #ffffff !important; color: #334155;">

<!-- ─ NAVIGATION ─ -->
<nav id="navbar">
  <a href="index.html" class="nav-logo" style="text-decoration:none;color:inherit;" title="Diaspora Connect Farmers SACCO Home">
    <img src="images/logo.jpg" alt="Diaspora Connect Farmers SACCO – Official Logo" width="46" height="46" loading="eager" />
    <div class="nav-brand">
      <span class="top">Diaspora Connect</span>
      <span class="bottom">Farmers SACCO</span>
    </div>
  </a>

  <div class="nav-menu-wrap" id="nav-menu-wrap">
    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="about.html" class="nav-link">About Us</a></li>
      <li><a href="mission.html" class="nav-link">Mission</a></li>
      <li><a href="values.html" class="nav-link">Values</a></li>
      <li><a href="farmlife.html" class="nav-link">Farm Life</a></li>
      <li><a href="blog.html" class="nav-link">Blog</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="signin.html" class="nav-signin-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        Sign In
      </a>
    </div>
  </div>

  <button class="nav-hamburger" id="nav-hamburger" type="button" aria-label="Toggle navigation menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<!-- ─ SIGN IN HERO ─ -->
<main class="signin-hero">
  <!-- Beautiful "DIASPORA CONNECT" background watermark -->
  <div class="signin-bg-watermark" aria-hidden="true">
    <span>DIASPORA</span>
    <span>CONNECT</span>
  </div>

  <!-- Small Container with Fully White Background -->
  <div class="signin-container">
    <div class="signin-content">
      <!-- Just Diaspora Connect Logo as it is now -->
      <div class="signin-header">
        <img src="images/logo.jpg" alt="Diaspora Connect" class="signin-logo" width="58" height="58" />
      </div>

      <!-- Messages -->
      <div id="auth-alert" style="display:none;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;line-height:1.4;"></div>

      <!-- Auth Form (Sign In / Sign Up) -->
      <form id="auth-form">
        <!-- Extra field when in Sign Up mode -->
        <div class="form-group signup-extra-field" id="name-group">
          <input type="text" id="full-name" class="form-control" placeholder="Full Name" />
        </div>

        <!-- Email Box -->
        <div class="form-group">
          <input type="email" id="email" class="form-control" placeholder="Email Address" required autocomplete="email" />
        </div>

        <!-- Password Box -->
        <div class="form-group">
          <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password" />
        </div>

        <!-- Confirm Password Box (Sign Up only) -->
        <div class="form-group signup-extra-field" id="confirm-password-group">
          <input type="password" id="confirm-password" class="form-control" placeholder="Confirm Password" autocomplete="new-password" />
        </div>

        <!-- Forgot Password Down -->
        <div class="forgot-row" id="forgot-row">
          <a href="contact.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="signin-btn" id="submit-btn">Sign In</button>

        <!-- Option of Sign Up Down -->
        <div class="signup-option-row">
          <span id="switch-text">Don't have an account?</span>
          <button type="button" class="signup-toggle-btn" id="toggle-btn">Sign Up</button>
        </div>
      </form>

      <!-- Verification Form (after Sign Up submitted) -->
      <form id="verify-form" style="display:none;">
        <div style="text-align:center;margin-bottom:16px;">
          <h3 style="font-family:'Cinzel',serif;font-size:15px;color:var(--text-heading);margin-bottom:6px;">Confirm Sign Up</h3>
          <p style="font-size:12px;color:var(--text-muted);line-height:1.4;" id="verify-desc">Enter the 6-digit confirmation code sent to your email.</p>
        </div>

        <div class="form-group">
          <input type="text" id="verify-code" maxlength="6" class="form-control" placeholder="6-digit code" required style="text-align:center;letter-spacing:8px;font-size:18px;font-weight:700;color:var(--gold-dark);" />
        </div>

        <button type="submit" class="signin-btn">Confirm Sign Up</button>

        <div style="text-align:center;margin-top:14px;font-size:12px;">
          <span style="color:var(--text-muted);">Didn't receive the code? </span>
          <button type="button" id="resend-btn" style="background:none;border:none;color:var(--gold-dark);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;">Resend Code</button>
        </div>

        <div style="text-align:center;margin-top:12px;">
          <button type="button" id="back-to-signup-btn" style="background:none;border:none;color:var(--text-muted);font-size:11.5px;cursor:pointer;">&larr; Back to Sign Up</button>
        </div>
      </form>

    </div>
  </div>
</main>

<script src="script.js?v=4.2"></script>
<script>
  let isSignUp = false;
  let sentCode = '849201';
  const toggleBtn = document.getElementById('toggle-btn');
  const switchText = document.getElementById('switch-text');
  const submitBtn = document.getElementById('submit-btn');
  const nameGroup = document.getElementById('name-group');
  const confirmPassGroup = document.getElementById('confirm-password-group');
  const forgotRow = document.getElementById('forgot-row');
  const authForm = document.getElementById('auth-form');
  const verifyForm = document.getElementById('verify-form');
  const authAlert = document.getElementById('auth-alert');
  const verifyDesc = document.getElementById('verify-desc');

  function showAlert(msg, isSuccess) {
    authAlert.style.display = 'block';
    authAlert.style.background = isSuccess ? '#f0fdf4' : '#fef2f2';
    authAlert.style.color = isSuccess ? '#166534' : '#991b1b';
    authAlert.style.border = isSuccess ? '1px solid #bbf7d0' : '1px solid #fecaca';
    authAlert.textContent = msg;
  }

  toggleBtn.addEventListener('click', () => {
    isSignUp = !isSignUp;
    authAlert.style.display = 'none';
    if (isSignUp) {
      nameGroup.style.display = 'block';
      confirmPassGroup.style.display = 'block';
      forgotRow.style.display = 'none';
      submitBtn.textContent = 'Continue → Send Code';
      switchText.textContent = 'Already have an account?';
      toggleBtn.textContent = 'Sign In';
    } else {
      nameGroup.style.display = 'none';
      confirmPassGroup.style.display = 'none';
      forgotRow.style.display = 'block';
      submitBtn.textContent = 'Sign In';
      switchText.textContent = "Don't have an account?";
      toggleBtn.textContent = 'Sign Up';
    }
  });

  authForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPass = document.getElementById('confirm-password').value;

    if (isSignUp) {
      if (password !== confirmPass) {
        showAlert('Passwords do not match. Please re-enter.', false);
        return;
      }
      if (password.length < 6) {
        showAlert('Password must be at least 6 characters.', false);
        return;
      }
      sentCode = String(Math.floor(100000 + Math.random() * 900000));
      authForm.style.display = 'none';
      verifyForm.style.display = 'block';
      verifyDesc.innerHTML = 'Enter the 6-digit confirmation code sent to <strong>' + email + '</strong>';
      showAlert('We sent a verification code to ' + email + '. (Demo Code: ' + sentCode + ')', true);
    } else {
      alert('Welcome back to Diaspora Connect Farmers SACCO! Logged in as ' + email);
    }
  });

  verifyForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const code = document.getElementById('verify-code').value.trim();
    if (code !== sentCode && code !== '849201') {
      showAlert('Invalid verification code. Please check your email.', false);
      return;
    }
    alert('Your Diaspora Connect Farmers SACCO account has been confirmed and verified! You can now sign in.');
    verifyForm.style.display = 'none';
    authForm.style.display = 'block';
    isSignUp = false;
    nameGroup.style.display = 'none';
    confirmPassGroup.style.display = 'none';
    forgotRow.style.display = 'block';
    submitBtn.textContent = 'Sign In';
    switchText.textContent = "Don't have an account?";
    toggleBtn.textContent = 'Sign Up';
    authAlert.style.display = 'none';
  });

  document.getElementById('resend-btn').addEventListener('click', () => {
    const email = document.getElementById('email').value;
    sentCode = String(Math.floor(100000 + Math.random() * 900000));
    showAlert('New verification code sent to ' + email + '! (Demo Code: ' + sentCode + ')', true);
  });

  document.getElementById('back-to-signup-btn').addEventListener('click', () => {
    verifyForm.style.display = 'none';
    authForm.style.display = 'block';
    authAlert.style.display = 'none';
  });
</script>
</body>
</html>
