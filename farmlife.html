      margin: 0 auto;
      padding: 60px 24px 80px;

    .farmlife-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      justify-items: center;
    }
    .farmlife-grid .farm-vid-card {
      width: 100%;
      max-width: 320px;
      height: 450px;
      cursor: pointer;
    }

        margin-top: 68px;
      }
      .farmlife-container {
        padding: 40px 16px 60px;
      }
      .farmlife-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

      }
      .farmlife-grid .farm-vid-card {
